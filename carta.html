<body data-pagina="carta">
  <a class="saltar" href="#contenido" data-i18n="a11y.saltar">Saltar al contenido</a>
  <div id="lugar-cabecera"></div>

  <main id="contenido" tabindex="-1">
    <section class="pagehero">
      <div class="wrap pagehero-in">
        <p class="k k-oro reveal"><i></i><span data-i18n="carta.kicker">Puerto Madero</span></p>
        <h1 class="h2n reveal d1" data-i18n="carta.t">La carta</h1>
        <p class="sub reveal d1" data-i18n="carta.s">Del fuego a tu mesa.</p>
        <p class="pagehero-p reveal d2" data-i18n="carta.p">Tocá un plato para ver el detalle o el + para sumarlo a tu pedido para retirar. Si comés en el salón, se lo pedís al mozo.</p>
      </div>
    </section>

    <nav class="carta-chips" id="carta-chips" aria-label="Categorías de la carta"></nav>

    <div class="carta-fondo">
      <div class="wrap carta-cuerpo" id="carta-cuerpo"></div>
      <div class="wrap carta-notas">
        <p class="carta-cubierto" id="carta-cubierto"></p>
        <p data-i18n="carta.nota">Los precios están en pesos argentinos. Si tenés alguna alergia, avisanos antes de pedir.</p>
      </div>
    </div>
  </main>

  <a class="carta-acceso" id="carta-acceso" href="pedir.html" hidden>
    <!-- Solo la bolsa y el número a la vista; la frase queda para lectores de pantalla. -->
    <i data-icono="bolsa"></i>
    <span class="carta-acceso-n" data-acceso-n>0</span>
    <span class="sr" data-i18n="carta.verPedido">Ver mi pedido</span>
  </a>

  <div id="lugar-pie"></div>

  <script src="js/data.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/icons.js"></script>
  <script src="js/common.js"></script>

  <script src="js/carta.js"></script>
